# 这是当前仓库供 Wttch Hook 和 Skill 读取的项目配置，不是分发给用户的配置示例。
# 完整示例见 skills/plugin-utils/example/config.yml；仓库内只保留无效的凭据占位符。
openrouter:
  api_key: "sk-or-v1-your-openrouter-api-key"
  decisions_url: "https://openrouter.ai/api/alpha/decisions"
  timeout: 60

features:
  model_gate: true
  model_gate_action: block
  blocked_models:
    - gpt-6-luna
    - gpt-6-sol
    - gpt-6-astra
