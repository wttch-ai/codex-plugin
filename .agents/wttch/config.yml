# 仅供 Wttch 插件的 Hook 和 Skill 运行时读取。复制到需要使用 JEV 的工作目录并
# 将内容写入项目 .agents/wttch/config.yml 后填入真实密钥。
# .agents/wttch/config.yml 应被 .gitignore 忽略，请勿将真实密钥写入本示例文件。
openrouter:
  api_key: "sk-or-v1-your-openrouter-api-key"
  model: "typesafe/jev-1.13"
  base_url: "https://openrouter.ai/api/v1"
  timeout: 20

features:
  jev_gate: true
  openrouter_review: true
  show_decision_reason: true
  audit_log: false
  model_gate: true
  model_gate_action: block
  blocked_models:
    - gpt-6-luna
    - gpt-6-sol
    - gpt-6-astra
