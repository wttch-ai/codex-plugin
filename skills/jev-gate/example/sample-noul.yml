# noul + UserPromptSubmit Hook 的完整示例；示例目录不会被运行时自动扫描。
# 启用前必须复制到项目 .agents/wttch/jev-decisions/，并按项目边界修改命题和提示。
version: 1
name: 自动处理判定
group: 内置示例
model: typesafe/jev-1.13
questions:
  safe_to_run:
    # noul 返回下方正向命题为真的概率，而不是直接返回 allow/block。
    type: noul
    instructions: >-
      该输入是否属于允许自动处理的 AI 级任务？AI 级任务是修改或维护 AI 本身，
      例如 Skill、Hook、Agent 提示词或 AI 运行时。项目级任务是修改用户项目的业务
      代码、配置、数据或部署。项目级任务只有在用户提示以“【项目级任务】”开头时
      才允许自动处理。
    criteria:
      "true": "AI 级任务；或以“【项目级任务】”开头的项目级任务。"
      "false": "未带“【项目级任务】”前缀的项目级任务。"

# noul 是上述正向命题为真的概率。此段由 UserPromptSubmit 适配器读取，
# 将概率区间映射为 Hook 输出；它不包含 API Key、模型或传输配置。
hook:
  user_prompt_submit:
    question: safe_to_run
    thresholds:
      # 概率 >= 0.80 进入 allow；0.40 <= 概率 < 0.80 进入 uncertain；
      # 概率 < 0.40 进入 deny。两个阈值都采用“包含下界”的语义。
      allow_at_or_above: 0.80
      uncertain_at_or_above: 0.40
    actions:
      # 命题为真的概率不低于 allow_at_or_above 时采用此分支。
      allow:
        action: allow
        message: "JEV 判断该请求可自动处理。"
      # 概率介于两个阈值之间时采用此分支；message 中的助手指令会随 warn 注入给 LLM。
      uncertain:
        action: warn
        message: >-
          JEV 判断可信度不足。助手指令：先检查当前对话中是否已有用户对“是否允许自动处理
          此请求？”的明确答复；若有则依照答复继续处理，不要重复提问；若没有，再向用户
          提出该问题。在收到明确确认前不要执行请求中的操作。
      # 概率低于 uncertain_at_or_above 时采用此分支。
      deny:
        action: warn
        message: >-
          该请求可能属于项目级任务。助手指令：先检查当前对话中是否已有用户对“此请求是否
          已获得项目级授权？”的明确答复；若有则依照答复继续处理，不要重复提问；若没有，
          再向用户提出该问题。在收到明确确认前不要执行请求中的操作。
