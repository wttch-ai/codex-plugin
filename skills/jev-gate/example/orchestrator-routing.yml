# 编排器项目路由示例：根据请求是否只维护编排器本身，注入不同执行提示。
# 本文件不会自动启用；复制到项目决策目录后，还应把 business-code-agent 替换为
# 目标编排器实际提供的 Agent 名称。
version: 1
name: 编排器任务路由
group: 编排器项目示例
model: typesafe/jev-1.13
questions:
  orchestrator_maintenance:
    # 使用正向 noul 命题：概率越高，越应留在当前编排器仓库维护。
    type: noul
    instructions: >-
      该用户请求是否只涉及当前编排器项目本身的代码、配置、提示词、Skill、Hook、
      Agent 定义或运行时维护，而不要求直接修改由编排器负责处理的业务项目代码？
    criteria:
      "true": >-
        只维护当前编排器项目，包括编排流程、Agent、Skill、Hook、提示词、配置和运行时。
      "false": >-
        要求实现、修改、修复或测试业务项目的代码、配置、数据、接口或部署内容。

hook:
  # 声明此段后，启用的插件 UserPromptSubmit Hook 会自动发现并执行本决策。
  # 一个项目最多只能有一个决策声明 user_prompt_submit，避免响应合并顺序不明确。
  user_prompt_submit:
    question: orchestrator_maintenance
    thresholds:
      allow_at_or_above: 0.80
      uncertain_at_or_above: 0.40
    actions:
      allow:
        # warn 表示请求继续，同时把 message 注入当前 Agent 上下文；它不会启动新 Agent。
        action: warn
        message: >-
          这是编排器代码维护任务。正常在当前编排器项目中完成，不要转交业务代码 Agent。
      uncertain:
        action: warn
        message: >-
          暂时无法确认这是编排器维护还是业务代码任务。先明确目标仓库和修改边界，再决定执行方式。
      deny:
        action: warn
        message: >-
          这是业务代码任务。不要直接在当前编排器项目中实现；请使用编排器提供的
          business-code-agent 执行，并将任务目标和业务项目上下文交给该 Agent。
