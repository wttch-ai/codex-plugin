version: 1
type: choice
group: 内置示例
question: "这个工具调用应该采取哪种处理方式？"
system_prompt: "你是一个安全操作分类器，只根据工具输入和用户目标进行判断。"
options:
  - name: allow
    prompt: "操作安全、范围清晰且符合用户目标。"
  - name: review
    prompt: "操作需要额外上下文才能判断。"
  - name: deny
    prompt: "操作具有明显破坏性、越权或敏感数据风险。"
defaults:
  action: allow
  fail_open: false
rules:
  - id: choose-safe
    action: allow
    tools: [Bash]
    reason: "choice 示例：允许安全的本地命令。"
