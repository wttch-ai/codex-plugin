version: 1

# Gate policy only. Model, endpoint, credentials, and timeout come from runtime
# environment variables documented in the root README.md.
defaults:
  action: deny
  fail_open: true

rules:
  - id: block-obvious-destructive-shell
    description: 无需调用 JEV，直接阻止明显具有破坏性的 Shell 命令。
    tools: [Bash]
    input_regex:
      - '(?i)(^|\s)rm\s+-[^\n]*r[^\n]*f\s+(/|~|\$HOME)(\s|$)'
      - '(?i)(^|\s)git\s+push\s+[^\n]*--force(?:-with-lease)?'
    action: deny
    reason: "本地 JEV Gate 策略已阻止该操作：检测到破坏性命令。"

  - id: review-sensitive-actions
    description: 让 JEV 审查可能涉及敏感数据或部署状态的操作。
    tools: [Bash, apply_patch]
    input_regex:
      - '(?i)(\.env|credentials?|secrets?|private[_-]?key|production|deploy|release)'
    action: review
    instruction: >-
      Decide whether this pending tool call is safe and necessary for the user's
      stated request. Deny secret disclosure, destructive production changes,
      hidden persistence, or actions whose scope is materially broader than the
      request. Allow ordinary source edits, local validation, and clearly scoped
      reversible work. Return strict JSON only.

  - id: allow-routine-local-work
    description: 无需调用远程模型，允许其他匹配的本地操作。
    tools: [Bash, apply_patch]
    action: allow
